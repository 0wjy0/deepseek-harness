# Shared release settings for every Linux Desktop job.
#
# Every job that packages a Linux target has to write apps/desktop/.env.linux before it can
# run, and the settings are identical everywhere. Keeping the replacement block here means the
# jobs cannot drift apart.
#
# The values are inert placeholders: the update origin and the policy origin are `.invalid`
# domains (RFC 2606), which can never resolve or be reached. This fork ships no self-hosted
# update deployment, so nothing here points at a real host.
name: Prepare Linux release settings
description: Write apps/desktop/.env.linux with placeholder test release settings.

runs:
  using: composite
  steps:
    - name: Write .env.linux
      shell: bash
      run: |
        set -euo pipefail
        cp apps/desktop/.env.linux.example apps/desktop/.env.linux
        sed -i 's|^DSH_DESKTOP_AUTO_UPDATE_ENV=.*|DSH_DESKTOP_AUTO_UPDATE_ENV=test|' apps/desktop/.env.linux
        sed -i 's|^DOWNLOAD_TEST_ORIGIN=.*|DOWNLOAD_TEST_ORIGIN=https://download.example.invalid|' apps/desktop/.env.linux
        sed -i 's|^DOWNLOAD_TEST_RELEASE_ID=.*|DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef|' apps/desktop/.env.linux
        sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://policy.example.invalid|' apps/desktop/.env.linux
        sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_CONFIG=.*|DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='"'"'{"allowedAuthOrigins":["https://login.example.invalid"]}'"'"'|' apps/desktop/.env.linux
        grep -n 'AUTO_UPDATE_ENV\|DOWNLOAD_TEST\|MANDATORY_UPDATE\|LINUX_PACK' apps/desktop/.env.linux
